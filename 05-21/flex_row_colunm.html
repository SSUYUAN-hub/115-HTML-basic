<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .allbox1 {
            width: 90%;
            height: 100%;
            background-color: lightblue;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;          /*強迫自動換行*/
        }

        .allbox2 {
            width: 40%;
            height: 150vh;
            background-color: lightpink;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-direction: column;
            flex-wrap: wrap;
        }

        .box {
            width: 200px;
            height: 200px;
            background-color: green;
            margin-top: 10px;
            margin-right: 10px;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>flex row</h2>
    <div class="allbox1">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <hr>

    <h2 style="text-align: left;margin-left: 170px;">flex column</h2>
    <div class="allbox2">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>

</html>
