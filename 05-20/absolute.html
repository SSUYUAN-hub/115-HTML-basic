<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: lightblue;
            height: 2000px;
        }
        .box {
            height: 200px;
            width: 200px;
            background-color: blue;
            position: relative;
            top: 0px;
            left: 0px;
        }
        .box1 {
            height: 50px;
            width: 50px;
            background-color: yellow;
            position: absolute;
            top: 0px;
            left: 150px;
        }
        .box2 {
            height: 50px;
            width: 50px;
            background-color: red;
            position: absolute;
            top: 150px;
            left: 150px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="box1"></div>
        <div class="box2"></div>
    </div>
    <hr>
    <div class="box">
        <div class="box1"></div>
        <div class="box2"></div>
    </div>
    <hr>
    <div class="box">
        <div class="box1"></div>
        <div class="box2"></div>
    </div>
</body>

</html>
