<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            width: 100%;
            background: radial-gradient(circle at top left, #fff9ec 0%, blanchedalmond 40%, #f6e8d3 100%);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .allbox {
            height: 80vh;
            width: 147vh;
            display: flex;
            flex-wrap: wrap;
            margin: 15px auto 0;
            justify-content: center;
            gap: 20px;
            padding-bottom: 20px;
        }

        .box {
            height: 40vh;
            width: 40vh;
            position: relative;
            margin-top: 40px;
            border-radius: 24px;
            overflow: hidden;
            background: linear-gradient(180deg, #c9e7ff 0%, #e4f2ff 100%);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .box:hover {
            transform: translateY(-6px);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.18);
        }

        .box1,
        .box2 {
            position: absolute;
            height: 44px;
            width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.14);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .box1 {
            top: 14px;
            right: 14px;
            background: #fff;
            border: 2px solid rgba(255, 125, 180, 0.45);
        }

        .box2 {
            bottom: 16px;
            left: 16px;
            background: radial-gradient(circle at top left, #e7f7ff 0%, #cce7ff 100%);
        }

        .box1:hover,
        .box2:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 1);
        }

        .box1 a,
        .box2 a {
            display: inline-flex;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            color: transparent;
            text-decoration: none;
            font-size: 1.2rem;
            text-indent: -9999px;
            overflow: hidden;
            position: relative;
        }

        .box1 a::before,
        .box2 a::before {
            content: "";
            position: absolute;
            inset: 6px;
            display: block;
            border-radius: 50%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: 72%;
        }

        .box1 a::before {
            background-color: rgba(255, 175, 203, 0.18);
            background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Cpath%20fill='%23ff5ca8'%20d='M12%202c-1.8%200-3.4.8-4.5%202.2-.8.9-1.3%202.1-1.3%203.4%200%202.8%202.2%205%205%205s5-2.2%205-5c0-1.3-.5-2.5-1.3-3.4C15.4%202.8%2013.8%202%2012%202z'/%3E%3Cpath%20fill='%23fff'%20d='M8.5%2010.5a1.5%201.5%200%201%201%200-3%201.5%201.5%200%200%201%200%203zm7%200a1.5%201.5%200%201%201%200-3%201.5%201.5%200%200%201%200%203z'/%3E%3Cpath%20fill='%23333'%20d='M8.2%2014.2c.4.4%201%20.6%201.5.6s1.1-.2%201.5-.6c.2-.2.5-.2.7%200%20.2.2.2.5%200%20.7-.6.6-1.3.9-2.2.9s-1.6-.3-2.2-.9c-.2-.2-.2-.5%200-.7.2-.2.5-.2.7%200z'/%3E%3C/svg%3E");
        }

        .box2 a::before {
            background-color: rgba(79, 163, 255, 0.18);
            background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Cpath%20fill='%230073ff'%20d='M12%205c-.3%200-.5.1-.7.3l-4%204c-.4.4-.4%201%200%201.4.4.4%201%20.4%201.4%200L11%209.4v7.2c0%20.6.4%201%201%201s1-.4%201-1V9.4l2.3%202.3c.4.4%201%20.4%201.4%200%20.4-.4.4-1%200-1.4l-4-4c-.2-.2-.5-.3-.7-.3z'/%3E%3Cpath%20fill='%230073ff'%20d='M6%2018h12c.6%200%201%20.4%201%201s-.4%201-1%201H6c-.6%200-1-.4-1-1s.4-1%201-1z'/%3E%3C/svg%3E");
        }

        .box1 a:hover::before,
        .box2 a:hover::before {
            transform: scale(1.1);
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 1rem;
        }

        .video-modal.open {
            display: flex;
        }

        .video-modal__overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
        }

        .video-modal__pane {
            position: relative;
            z-index: 1;
            width: min(90vw, 84vh);
            max-width: 900px;
            border-radius: 24px;
            overflow: hidden;
            background: #111;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4);
        }

        .video-modal__close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            color: #111;
            font-size: 1.4rem;
            cursor: pointer;
            z-index: 2;
        }

        .video-modal__close:hover {
            background: #fff;
        }

        .video-modal video {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
        }
    </style>
</head>

<body>
    <div class="allbox">
        <div class="box">
            <img src="./images/1.jpg" alt="">

            <div class="box2">

        <div class="box">

            </div>
            <div class="box2">

            </div>
        </div>

        <div class="box">
            <img src="./images/4.jpg" alt="">

            </div>
            <div class="box2">

        <div class="box">

            </div>
            <div class="box2">

        </div>

        <div class="box">
            <img src="./images/6.jpg" alt="">

            <div class="box2">

    </div>

    <div class="video-modal" id="videoModal" aria-hidden="true">
        <div class="video-modal__overlay" id="videoModalOverlay"></div>
        <div class="video-modal__pane">
            <button type="button" class="video-modal__close" id="videoModalClose" aria-label="關閉影片">×</button>
            <video id="modalVideo" controls playsinline>
                <source src="" type="video/mp4">
                您的瀏覽器不支援影片播放。
            </video>
        </div>
    </div>

    <script>
        (function () {
            const modal = document.getElementById('videoModal');
            const overlay = document.getElementById('videoModalOverlay');
            const closeButton = document.getElementById('videoModalClose');
            const video = document.getElementById('modalVideo');
            const source = video.querySelector('source');
            const playLinks = document.querySelectorAll('.box1 a');

            function openModal(src) {
                source.src = src;
                video.load();
                modal.classList.add('open');
                modal.setAttribute('aria-hidden', 'false');
                video.play().catch(() => { });
            }

            function closeModal() {
                modal.classList.remove('open');
                modal.setAttribute('aria-hidden', 'true');
                video.pause();
                video.currentTime = 0;
                source.src = '';
                video.load();
            }

            playLinks.forEach(link => {
                link.addEventListener('click', function (event) {
                    event.preventDefault();
                    const videoUrl = this.getAttribute('href');
                    if (videoUrl) {
                        openModal(videoUrl);
                    }
                });
            });

            closeButton.addEventListener('click', closeModal);
            overlay.addEventListener('click', closeModal);
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && modal.classList.contains('open')) {
                    closeModal();
                }
            });
        })();
    </script>
</body>

</html>
