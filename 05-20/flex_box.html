<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .allbox {
            width: 80%;
            height: 700px;
            background-color: lightgreen;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: auto;
            flex-wrap: wrap;
        }

        .box {
            width: 300px;
            height: 300px;
            background-color: lightblue;
            margin: 20px;
        }

        #item {
            opacity: 0;
        }
    </style>
</head>

<body>
    <div class="allbox">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box" id="item"></div>
    </div>

</body>

</html>
