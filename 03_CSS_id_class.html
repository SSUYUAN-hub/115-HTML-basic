<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* style */
        /* id(#)權重大於class(.) */
        /* id是唯一，class可以套用多行 */
        .box {
            width: 300px;
            height: 300px;
            background-color: red;
        }
        #box1 {
            width: 300px;
            height: 300px;
            background-color: blue;

        }
    </style>

</head>

<body>
    <div class="box" id="box1">
    </div>
    <br>
    <div class="box" id="box2">
    </div>
</body>

</html>
