<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <style>
        .box {
            width: 300px;
            height: 300px;
            background-color: lightblue;
            margin: auto;
            margin-top: 20px;
            border-radius: 20px;
        }

        .input-container {
            background-color: lightblue;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .output-container {
            background-color: lightpink;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50px;
        }

        input {
            width: 80%;
            height: 30px;
            border-radius: 20px;
            text-align: center;
        }

        button {
            width: 50%;
            height: 30px;
            border-radius: 20px;
        }
    </style>
</head>

<body>
    <div class="box input-container">
        <input type="text" name="num1" id="num1" value="100" placeholder="num1?">
        <input type="text" name="num2" id="num2" value="200" placeholder="num2?">
        <input type="text" name="opt" id="opt" value="+" placeholder="opt?">
        <button type="button" id="myBtn">submit</button>
    </div>
    <div class="box output-container">
        <span id="mySpan">1 + 1 = 2</span>
    </div>

    <!-- jquery  -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script>
$(document).ready(function(){
const myBtn=$('#myBtn');
const num1=$('#num1');
const num2=$('#num2');
const opt=$('#opt');
const mySpan=$('#mySpan');

myBtn.click(function(e){
let getNum1=Number(num1.val());
let getNum2=Number(num2.val());
let getOpt=opt.val();
let result=0;
if(getOpt=="+"){
    result=getNum1+getNum2;
}else if(getOpt=="-"){
    result=getNum1-getNum2;
}else if(getOpt=="*"){
    result=getNum1*getNum2;
}else if(getOpt=="/"){
    result=getNum1/getNum2;
}else{
    alert('opt請輸入 + - * / ');
    location.reload();
    return false;
}

let tmpText=`${getNum1}${getOpt}${getNum2}=${result}`
mySpan.text(tmpText);
})




})



      </script>
</body>
</html>
