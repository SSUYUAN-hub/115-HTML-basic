<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            boder: 1px solid black;
            border-collapse: collapse;
            text-align: center;
            font-size: 30px;
            margin: auto;
        }

        td,
        th {
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <table style="width: 35%; height: 500px;">
        <tr>
            <td colspan="2">1</td>
            <td>1</td>
        </tr>
        <tr>
            <td>5</td>
            <td>5</td>
            <td rowspan="2">5</td>
        </tr>
        <tr>
            <td>3</td>
            <td>3</td>
        </tr>


    </table>
</body>

</html>
