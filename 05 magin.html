<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1 {
            background-color: red;
            margin-left: 150px;
            margin-top: 100px;
width: 150px;
height: 150px;

        }

        /* margin數值有衝突的時候，以數值大的為主 */
        .box2 {
            background-color: green;
            margin-left: 70%;
        }

        div {
            width: 150px;
            height: 150px;
        }
        img{
            width: 100%;
            height: 100%;
            
        }
        img:hover{
transform: scale(1.8) rotate(5deg);


        }
    </style>
</head>

<body>
    <div class="box1">
        &nbsp;
        <img src="./05-07/images/cat1.jpg">
    </div>
    <div class="box2">
        &nbsp;
        <img src="./05-07/images/cat2.jpg">
    </div>
</body>

</html>
