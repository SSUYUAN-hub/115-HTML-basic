<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Document</title>


    <style>
        .allbox {
            font-size: 50px;
            text-align: center;
            align-items: center;
            clear: both;
        }

        .box1 {
            width: 100%;
            height: 24vh;
            background-color: aqua;
            margin-top: -5px;
        }

        .box2 {
            width: 50%;
            height: 24vh;
            margin-right: 2px;
            margin-top: 5px;
            float: left;
            background-color: lightgreen;

        }

        .box3 {
            width: 49.5%;
            height: 24vh;
            margin-top: 5px;
            float: right;
            background-color: lightcoral;
        }

        .box4 {
            width: 33%;
            height: 25vh;
            float: left;
            margin-right: 5px;
            margin-top: 5px;
            background-color: lightseagreen;
        }

        .box5 {
            width: 33%;
            height: 25vh;
            float: left;
            margin-right: 5px;
            margin-top: 5px;
            margin-left: 3px;

        }

            width: 33%;
            height: 25vh;
            float: right;
            margin-top: 5px;
            background-color: rgb(156, 99, 60);

        .box7 {
            width: 25%;
            height: 25vh;
            float: left;
            margin-top: 5px;
            background-color: rgb(255, 0, 13);
        }

        .box8 {
            width: 24.5%;
            height: 25vh;
            float: left;
            margin-top: 5px;
            margin-left: 7px;
            background-color: rgb(127, 42, 238);
        }

        .box9 {
            width: 24.5%;
            height: 25vh;
            float: left;
            margin-top: 5px;
            margin-left: 7px;
            background-color: rgb(199, 240, 105);
        }

        .box10 {
            width: 24.5%;
            height: 25vh;
            float: right;
            margin-top: 5px;
            background-color: rgb(14, 248, 112);
        }
    </style>
</head>

<body>
    <div class="allbox">
        <div class="box1"><img src="./images/cat6.png" width="100%" height="100%"></div>

        <div class="box2"><img src="./images/cat2.png" width="100%" height="100%"></div>
        <div class="box3"><img src="./images/cat3.png" width="100%" height="100%"></div>

        <div class="box4"><img src="./images/cat4.png" width="100%" height="100%"></div>

        <div class="box7"><img src="./images/cat7.png" width="100%" height="100%"></div>
        <div class="box8"><img src="./images/cat8.png" width="100%" height="100%"></div>
        <div class="box9"><img src="./images/cat9.png" width="100%" height="100%"></div>
        <div class="box10"><img src="./images/cat10.png" width="100%" height="100%"></div>

</html>
